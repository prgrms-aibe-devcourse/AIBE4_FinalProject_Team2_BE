spring:
  application:
    name: aibe-team2-api

  profiles:
    default: dev

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# 외부 API
gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: ${GEMINI_API_URL}

retell:
  api:
    key: ${RETELL_API_KEY}
  agent:
    id: ${RETELL_AGENT_ID}
  webhook:
    secret: ${RETELL_WEBHOOK_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

aws:
  region: ${AWS_REGION:ap-northeast-2}

  s3:
    bucket: ${AWS_S3_BUCKET:aibe-bucket}
    presign-expiration-minutes: ${AWS_S3_PRESIGN_EXPIRATION_MINUTES:10}
    allowed-content-types: ${AWS_S3_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg}

    max-upload-bytes:
      resume: ${AWS_S3_MAX_UPLOAD_RESUME_BYTES:10485760}   # 10MB
      audio: ${AWS_S3_MAX_UPLOAD_AUDIO_BYTES:52428800}