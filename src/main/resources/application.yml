# 아래의 설정은 예시입니다. 프로젝트 환경에 맞춰 자유롭게 수정하세요.
spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 로 접속 가능
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
  data:
    redis:
      host: localhost
      port: 6379

  # Security 설정 (JWT 세팅 시 필요)
  security:
    user:
      password: "my-password123"

# AI API 관련 설정 (OpenAI 등 사용 시 활용)
ai:
  api:
    key: ${AI_API_KEY:your-placeholder-key}
    url: https://api.openai.com/v1

logging:
  level:
    # 컨벤션: @Slf4j 로그 레벨 제어
    com.aibe.team2: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  default-consume-media-type: application/json
  default-produce-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html # 접속 경로 (기본값)
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs # API 설계 문서(JSON) 경로

