spring:
  application:
    name: aibe-team2-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  # 기본값(로컬 개발용)
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    com.aibe.team2: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# 외부 API 및 인프라 공통 설정
gemini:
  api:
    key: ${GEMINI_API_KEY:dummy-key}
    url: ${GEMINI_API_URL:https://dummy-url.com}

openai:
  api:
    key: ${OPENAI_API_KEY:dummy_key_for_now}

retell:
  api:
    key: ${RETELL_API_KEY:dummy_key_for_now}
  agent:
    id: ${RETELL_AGENT_ID:dummy_agent_id}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

  s3:
    endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}
    bucket: aibe-bucket
    presign-expiration-minutes: 10
    allowed-content-types: application/pdf,image/png,image/jpeg

  sqs:
    endpoint: http://${LOCALSTACK_HOST:localhost}:${LOCALSTACK_PORT:4566}