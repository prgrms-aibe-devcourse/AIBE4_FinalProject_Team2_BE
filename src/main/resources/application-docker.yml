spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aibe}
    username: ${MYSQL_USER:aibe}
    password: ${MYSQL_PASSWORD:aibe1234}

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate

aws:
  sqs:
    endpoint: http://${LOCALSTACK_HOST:localstack}:${LOCALSTACK_PORT:4566}
    region: ${AWS_REGION:ap-northeast-2}

