spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
#  GEMINI_API_KEY
#  OPEN_API_KEY
#  RETELL_API_KEY
#  RETELL_AGENT_ID

  data:
    redis:
      host: ${DOCKER_REDIS_HOST:redis}
      port: ${DOCKER_REDIS_PORT:6379}