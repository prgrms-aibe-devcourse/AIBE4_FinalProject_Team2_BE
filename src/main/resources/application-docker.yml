server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aibe_team2}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${DOCKER_REDIS_HOST:redis}
      port: ${DOCKER_REDIS_PORT:6379}

  batch:
    job:
      enabled: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      s3:
        endpoint: http://${LOCALSTACK_HOST:localstack}:${LOCALSTACK_PORT:4566}
      sqs:
        endpoint: http://${LOCALSTACK_HOST:localstack}:${LOCALSTACK_PORT:4566}