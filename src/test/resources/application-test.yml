# src/test/resources/application-test.yml

spring:
  config:
    activate:
      on-profile: test

  # [추가됨] Redis 설정이 없어서 에러가 났었습니다. 테스트용으로 로컬 설정을 넣어줍니다.
  data:
    redis:
      host: localhost
      port: 6379

  # H2 DB 설정
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # OAuth2 클라이언트 더미
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-id
            client-secret: dummy-google-secret
          kakao:
            client-id: dummy-kakao-id
            client-secret: dummy-kakao-secret

# 외부 API 및 JWT 더미 설정 (이게 있어야 API Key 에러가 안 납니다)
gemini:
  api:
    key: dummy-key
    url: https://dummy-url.com

openai:
  api:
    key: dummy-key

retell:
  api:
    key: dummy-key
    agent:
      id: dummy-id

aws:
  sqs:
    endpoint: http://localhost:4566
    region: ap-northeast-2

jwt:
  secret: dummy-secret-key-must-be-very-very-very-long-to-pass-validation