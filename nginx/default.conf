server {
    listen 80;
    server_name your-domain.com; # 나중에 구매할 도메인 주소

    location / {
        proxy_pass http://localhost:8080; # 스프링 부트 서버로 연결
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE를 위한 설정 (실시간 통신 시 끊김 방지)
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}